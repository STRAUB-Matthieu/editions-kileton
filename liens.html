    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --night-blue: #0A1628;
            --gold: #D4AF37;
            --gold-light: #E8D48B;
            --pure-white: #FFFFFF;
            --deep-blue: #1B3A5C;
            --muted: #8896A6;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--night-blue);
            color: var(--pure-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Halo doré subtil */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center 30%, rgba(212,175,55,0.08) 0%, #0A1628 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 0 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* ===== IMAGE HÉROÏQUE ===== */
        .hero {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 0 0 24px 24px;
        }

        .hero-img {
            display: block;
            width: 100%;
            min-height: 90vh;
            object-fit: cover;
            object-position: center top;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 40px rgba(212,175,55,0.1);
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4rem 1.5rem 2rem;
            background: linear-gradient(transparent, rgba(10,22,40,0.85) 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: clamp(1.75rem, 6vw, 2.5rem);
            color: var(--pure-white);
            letter-spacing: 0.05em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }

        .hero-author {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.6rem;
        }

        .hero-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(1rem, 3.5vw, 1.15rem);
            color: var(--gold-light);
            line-height: 1.4;
        }

        /* ===== SECTIONS ===== */
        .sections {
            width: 100%;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 2rem auto;
            border: none;
        }

        .section-label {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            text-align: center;
            margin-bottom: 1rem;
        }

        /* ===== BOUTONS ===== */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .link-button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 360px;
            margin: 0.5rem auto;
            padding: 0.85rem 1.25rem;
            background: rgba(27, 58, 92, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: var(--pure-white);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .link-button:hover {
            background: rgba(27, 58, 92, 0.7);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .link-button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .link-button svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        /* ===== CLIP VIDÉO ===== */
        .video-wrapper {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.5),
                0 0 20px rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.2);
        }

        .video-wrapper iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .footer-logo {
            height: 30px;
            width: auto;
        }

        .footer-text {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
        }

        /* ===== RESPONSIVE — Tablette ===== */
        @media (min-width: 481px) {
            .hero-img {
                min-height: 80vh;
            }

            .hero-overlay {
                padding: 5rem 2rem 2.5rem;
            }

            .sections {
                padding: 0 2rem;
            }
        }

        /* ===== RESPONSIVE — Desktop ===== */
        @media (min-width: 769px) {
            .container {
                padding-top: 2rem;
            }

            .hero {
                border-radius: 16px;
                max-width: 520px;
            }

            .hero-img {
                min-height: auto;
                max-height: 70vh;
                border-radius: 16px;
            }

            .hero-overlay {
                border-radius: 0 0 16px 16px;
                padding: 6rem 2rem 2.5rem;
            }

            .sections {
                padding: 0 2.5rem;
            }

            .divider {
                margin: 2.5rem auto;
            }
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            .link-button {
                transition: none;
            }
            .link-button:hover {
                transform: none;
            }
        }
    </style>
</head>
